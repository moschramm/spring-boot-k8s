apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spring-boot-demo-ingress
  namespace: demo-app
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: demo.example.local        # replace with your host
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: spring-boot-demo
                port:
                  number: 80
  # TLS block can be added if you have a cert
  # tls:
  #   - hosts: [demo.example.local]
  #     secretName: demo-tls

