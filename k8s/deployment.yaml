apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-boot-demo
  namespace: demo-app
  labels:
    app.kubernetes.io/name: spring-boot-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: spring-boot-demo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spring-boot-demo
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      # Security: run non-root where possible
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: app
          image: entity7790/demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-app-db-secret
                  key: JDBC_DATABASE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-app-db-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-app-db-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_APPLICATION_NAME
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: SPRING_APPLICATION_NAME
            - name: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
              valueFrom:
                configMapKeyRef:
                  name: demo-app-config
                  key: MANAGEMENT_ENDPOINTS_WEB_BASE_PATH
            # optional: if you really want a separate management port, set it to a number:
            # - name: MANAGEMENT_SERVER_PORT
            #   value: "8081"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
      # imagePullSecrets:
      #   - name: dockerhub-pull-secret   # only if private image; create if needed
      terminationGracePeriodSeconds: 30

