apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-app-config
  namespace: demo-app
data:
  # Application-level defaults; prefer env vars for secrets like DB credentials
  SPRING_APPLICATION_NAME: spring-boot-demo
  SERVER_PORT: "8080"
  # provide JDBC URL template; actual credentials via secret
  JDBC_DATABASE_URL: jdbc:postgresql://postgres.demo-app.svc.cluster.local:5432/demo
  # actuator base path (optional)
  MANAGEMENT_ENDPOINTS_WEB_BASE_PATH: /actuator

