apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: demo-app
  labels:
    app: loki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
    spec:
      securityContext:
        fsGroup: 10001           # ensure group ownership for the mounted volume
      initContainers:
        - name: init-chown-loki
          image: busybox
          command:
            - sh
            - -c
            - |
              mkdir -p /loki/index /loki/chunks /loki/boltdb-cache /loki/compactor /loki/wal || true
              chown -R 10001:10001 /loki || true
          volumeMounts:
            - name: loki-storage
              mountPath: /loki
      containers:
        - name: loki
          image: grafana/loki:2.9.1
          args:
            - -config.file=/etc/loki/local-config.yaml
          ports:
            - containerPort: 3100
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki
            - name: loki-storage
              mountPath: /loki
      volumes:
        - name: loki-config
          configMap:
            name: loki-config
        - name: loki-storage
          persistentVolumeClaim:
            claimName: loki-data

